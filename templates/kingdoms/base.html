<!doctype html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kingdom Sheet{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'kingdoms/site.css' %}">
</head>
<body>
  <h1>{% block heading %}Kingdom Sheet{% endblock %}</h1>
  <p class="hint"><a href="{% url 'kingdoms:home' %}">Your kingdoms</a> &middot; <a href="{% url 'kingdoms:names' %}">Name</a></p>

  {% block content %}{% endblock %}

  <p class="hint">Your name and kingdom list are remembered with a session cookie in this browser.</p>
</body>
</html>
